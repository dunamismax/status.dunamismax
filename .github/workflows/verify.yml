name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * 2'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: test "$(node --version)" = v24.22.1 && test "$(npm --version)" = 11.19.1
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Disposable PostgreSQL 18 toolchain
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release; echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-18
          sudo ln -s "$(dirname "$(dirname "$(command -v node)")")" /opt/astro-runtime
          printf '#!/bin/sh\nexec env PATH=/opt/astro-runtime/bin:$PATH "$@"\n' | sudo tee /usr/local/bin/astro-runtime >/dev/null
          sudo chmod 755 /usr/local/bin/astro-runtime
      - run: astro-runtime bash tests/postgres.sh
      - run: npm audit --audit-level=moderate
