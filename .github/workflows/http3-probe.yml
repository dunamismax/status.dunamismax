name: External HTTP3 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quic:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv /tmp/quic-client && /tmp/quic-client/bin/pip install aioquic==1.3.0
      - run: /tmp/quic-client/bin/python scripts/http3-probe.py dunamismax.com dunamismax.com
