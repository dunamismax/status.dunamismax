; Installed as /etc/status-dunamismax/php-fpm.conf and linked from
; /etc/php/8.5/fpm/pool.d/status-dunamismax.conf by deploy/10-provision.sh.
; The web pool only reads MySQL. It cannot run commands or open URLs, and its
; user has no access to the repositories, Docker, or collector credentials.
[status-dunamismax]
user = status-dunamismax-web
group = status-dunamismax-web

listen = /run/php/status-dunamismax.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0600

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[zend.exception_ignore_args] = on
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,mail
php_admin_value[open_basedir] = /srv/www/status.dunamismax.com/:/etc/status-dunamismax/web.env
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 15
