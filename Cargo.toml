[workspace]
members = ["crates/status-web"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dunamismax/status.dunamismax"
rust-version = "1.95"
homepage = "https://status.dunamismax.com/"
readme = "README.md"

[workspace.dependencies]
axum = "0.8.9"
chrono = "0.4.44"
leptos = "0.8.19"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = "1.0.228"
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false }
thiserror = "2.0.18"
tokio = "1.52.3"
tower = "0.5.3"
tower-http = "0.6.10"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
